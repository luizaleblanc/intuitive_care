version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - APP_ENV=development
      - DB_ENGINE=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      # DB_PASSWORD vem do .env da raiz (montado em /app), para acompanhar a senha real do MySQL.
      - DB_NAME=intuitive_care
      # MAIL_* e FRONTEND_URL vêm do .env da raiz.
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: python -m backend.app

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: intuitive_care
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/backup_intuitive_care.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Captura os e-mails de desenvolvimento: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"

volumes:
  mysql_data:
