const Icon = ({ name, size = 18, className = '', strokeWidth = 2 }) => {
  const node = (window.lucide && window.lucide.icons && window.lucide.icons[name]) || null;
  if (!node) return <span style={{ width: size, height: size, display: 'inline-block' }} />;
  const children = Array.isArray(node[0]) ? node : (node[2] || []);
  return (
    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
      {children.map(([tag, attrs], i) => React.createElement(tag, { key: i, ...attrs }))}

  );
};

const PillBarChart = ({ data, height = 200, highlightLast = true, unit = 'bi' }) => {
  const [hover, setHover] = useState(null);
  const max = Math.max(...data.map((d) => d.v));
  return (
    <div className="flex items-end justify-between gap-3" style={{ height }}>
      {data.map((d, i) => {
        const h = (d.v / max) * (height - 44);
        const active = hover === i || (hover === null && highlightLast && i === data.length - 1);
        return (
          <div key={d.q} className="flex flex-1 flex-col items-center gap-2" onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}>
            <div className={cx('rounded-full px-2 py-0.5 text-[11px] font-semibold transition-opacity', active ? 'bg-forest text-white opacity-100' : 'opacity-0')}>
              {d.v.toFixed(1)} {unit}
            </div>
            <div className="relative w-full max-w-[44px] rounded-full bg-sage/70" style={{ height: height - 44 }}>
              <div className={cx('absolute bottom-0 w-full rounded-full transition-all duration-500', active ? 'bg-forest' : 'bg-mint')} style={{ height: h }} />
            </div>
            <span className="text-[11px] font-medium text-muted">{d.q}</span>
          </div>
        );
      })}
    </div>
  );
};

const Donut = ({ data, size = 170, center = '1.247', sub = 'operadoras' }) => {
  const r = 62, c = 2 * Math.PI * r;
  let acc = 0;
  return (
    <div className="relative" style={{ width: size, height: size }}>
      <svg viewBox="0 0 160 160" width={size} height={size} className="-rotate-90">
        <circle cx="80" cy="80" r={r} fill="none" stroke="rgba(17,62,50,.08)" strokeWidth="20" />
        {data.map((d) => {
          const len = (d.pct / 100) * c;
          const el = <circle key={d.label} cx="80" cy="80" r={r} fill="none" stroke={d.color} strokeWidth="20"
            strokeDasharray={`${Math.max(len - 3, 0)} ${c}`} strokeDashoffset={-acc} strokeLinecap="round" />;
          acc += len;
          return el;
        })}
      </svg>
      <div className="absolute inset-0 grid place-items-center text-center">
        <div><div className="font-display text-2xl font-bold text-forest">{center}</div><div className="text-[11px] font-medium text-forest/70">{sub}</div></div>
      </div>
    </div>
  );
};

const PipelineCard = ({ toast }) => {
  const initial = [
    { k: 'Extract', d: 'Download ZIPs do portal de dados abertos ANS', p: 100, s: 'Extraído' },
    { k: 'Transform', d: 'Limpeza, normalização de CNPJ e encoding', p: 100, s: 'Consolidado' },
    { k: 'Load', d: 'Carga em demonstracoes_contabeis (PostgreSQL)', p: 100, s: 'Consolidado' },
  ];
  const [stages, setStages] = useState(initial);
  const [running, setRunning] = useState(false);
  const run = () => {
    if (running) return;
    setRunning(true);
    setStages(initial.map((s) => ({ ...s, p: 0, s: 'Extraído' })));
    let step = 0, prog = 0;
    const iv = setInterval(() => {
      prog += 10;
      setStages((prev) => prev.map((s, i) => {
        if (i < step) return { ...s, p: 100, s: 'Consolidado' };
        if (i === step) return { ...s, p: Math.min(prog, 100), s: 'Em Tratamento' };
        return { ...s, p: 0, s: 'Extraído' };
      }));
      if (prog >= 100) { step += 1; prog = 0; }
      if (step > 2) {
        clearInterval(iv);
        setStages(initial);
        setRunning(false);
        toast('Pipeline concluída · 2.184.906 linhas carregadas');
      }
    }, 120);
  };
  return (
    <Card className="p-6">
      <div className="flex items-center justify-between">
        <div>
          <h3 className="font-display text-[17px] font-bold">Pipeline ETL · Lote do 4º trimestre de 2025</h3>
          <p className="text-sm text-muted">Agendada diariamente às 03:00 · Última execução há 12 min</p>
        </div>
        <Button icon={running ? undefined : 'Play'} onClick={run} disabled={running}>
          {running ? <><span className="animate-spin inline-flex"><Icon name="LoaderCircle" size={16} /></span>Executando...</> : 'Executar Pipeline Agora'}
        </Button>
      </div>
      <div className="mt-5 grid grid-cols-3 gap-4">
        {stages.map((s, i) => (
          <div key={s.k} className="rounded-2xl bg-surface p-4">
            <div className="flex items-center justify-between">
              <span className="flex items-center gap-2 text-sm font-bold"><span className="grid h-6 w-6 place-items-center rounded-full bg-forest text-[11px] text-mint">{i + 1}</span>{s.k}</span>
              <StatusBadge status={s.s} />
            </div>
            <p className="mt-2 text-xs text-muted">{s.d}</p>
            <div className="mt-3 h-2 overflow-hidden rounded-full bg-white">
              <div className="h-full rounded-full bg-mint transition-all duration-150" style={{ width: `${s.p}%` }} />
            </div>
            <div className="mt-1.5 text-right text-[11px] font-semibold text-forest">{s.p}%</div>
          </div>
        ))}
      </div>
    </Card>
  );
};

        ))}
      </div>

      <Sidebar page={page} setPage={(p) => { setPage(p); setLoggedOut(false); }} isAdmin={isAdmin} />
      <main className="ml-[260px] px-10 pb-12 pt-[76px]">
        {loggedOut ? <LoggedOut onBack={() => { setLoggedOut(false); setPage('dashboard'); }} /> : (
          <>
            <Topbar user={user} title={title} subtitle={sub} setPage={setPage} onExport={!isAdmin && page !== 'perfil' ? () => showToast('Relatório consolidado exportado (CSV)') : null} />
            <div className="mt-7" key={role + page}>
              {page === 'dashboard' && <Dashboard isAdmin={isAdmin} toast={showToast} />}
              {page === 'operadoras' && <Operadoras isAdmin={isAdmin} toast={showToast} />}
              {page === 'despesas' && <Despesas isAdmin={isAdmin} toast={showToast} />}
              {page === 'pipeline' && isAdmin && <Pipeline toast={showToast} />}
              {page === 'api' && isAdmin && <div className="grid grid-cols-12 gap-6 fade-up"><div className="col-span-8"><ApiPanel toast={showToast} /></div><div className="col-span-4 space-y-6"><EndpointWidget /><DonutCard title="Consumo por rota" /></div></div>}
              {page === 'perfil' && <Perfil user={user} setUser={(u) => setUsers({ ...users, [role]: u })} isAdmin={isAdmin} toast={showToast} onLogout={() => (onLogout ? onLogout() : setLoggedOut(true))} />}
            </div>
          </>
        )}
      </main>
      <Toast msg={toast} />
    </div>
  );
};

/* ============ Página inicial e Login ============ */
const PublicHeader = ({ onLogin, onHome, onBack }) => (
  <header className="sticky top-0 z-40 border-b border-slate-200/70 bg-white/90 backdrop-blur">
    <div className="mx-auto flex h-16 max-w-[1200px] items-center justify-between gap-4 px-5 sm:px-8">
      <button onClick={onHome} className="min-w-0"><LogoHorizontal size={36} /></button>
      <div className="flex items-center gap-2">
        <button onClick={onBack} className="hidden rounded-full px-4 py-2 text-sm font-medium text-muted hover:bg-surface hover:text-ink md:inline-flex">Design System</button>
        {onLogin && <Button size="md" icon="LogIn" onClick={onLogin}>Entrar</Button>}
      </div>
    </div>
  </header>
);

const Home = ({ onLogin, onBack }) => (
  <div className="flex min-h-screen flex-col bg-white">
    <header className="mx-auto flex w-full max-w-[1200px] items-center justify-end px-5 py-5 sm:px-8">
      <Button size="md" icon="LayoutGrid" onClick={onBack}>Design System</Button>
    </header>

    <main className="flex flex-1 flex-col items-center justify-center px-5 pb-16 text-center sm:px-8">
      <div className="relative">
        <div className="absolute inset-0 -z-10 scale-150 rounded-full bg-mint/15 blur-3xl" />
        <Mark size={132} bg="#113E32" sw={2} />
      </div>
      <div className="mt-7 font-display text-[32px] font-extrabold tracking-tight text-forest sm:text-[40px]">intuitivecare</div>
      <div className="mt-1 text-[11px] font-semibold uppercase tracking-[.2em] text-muted">Controle e Tratamento de dados</div>

      <h1 className="mt-12 max-w-3xl text-balance font-display text-[32px] font-extrabold leading-[1.12] tracking-tight text-ink sm:text-[48px]">
        Pare de tratar planilhas.<br /><span className="text-forest">Comece a tomar decisões.</span>
      </h1>
      <p className="mt-5 max-w-xl text-balance text-[17px] leading-relaxed text-muted">
        Os dados da saúde suplementar chegam brutos, fragmentados e difíceis de confiar. A Intuitive Care entrega tudo limpo, validado e pronto para você enxergar o que importa.
      </p>
      <div className="mt-9 flex flex-col gap-3 sm:flex-row">
        <Button size="lg" iconRight="ArrowRight" onClick={onLogin}>Começar agora</Button>
      </div>
      <p className="mt-4 text-xs text-muted">Acesso para administradores e analistas.</p>

      <div className="mt-20 grid w-full max-w-4xl gap-10 text-left sm:grid-cols-3">
        {[
          ['Confiança', 'Cada registro é validado antes de chegar até você. Sem retrabalho, sem dúvida.'],
          ['Clareza', 'Operadoras e despesas organizadas para você entender em segundos, não em horas.'],
          ['Tempo', 'O trabalho repetitivo fica com a gente. A análise que gera valor fica com você.'],
        ].map(([t, d]) => (
          <div key={t}>
            <div className="h-1 w-8 rounded-full bg-mint" />
            <h3 className="mt-4 font-display text-lg font-bold text-forest">{t}</h3>
            <p className="mt-2 text-sm leading-relaxed text-muted">{d}</p>
          </div>
        ))}
      </div>
    </main>

    <footer className="py-6 text-center text-xs text-muted">Intuitive Care · Controle e Tratamento de dados</footer>
  </div>
);

const ACCOUNTS = {
  'admin@intuitivecare.com.br': { pass: 'Admin@2025', role: 'admin' },
  'consumidor@intuitivecare.com.br': { pass: 'Consulta@2025', role: 'consumer' },
};

const Login = ({ onSuccess, onHome, onBack }) => {
  const [email, setEmail] = useState('');
  const [pass, setPass] = useState('');
  const [show, setShow] = useState(false);
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);
  const submit = (e) => {
    e.preventDefault();
    setErr('');
    if (!email || !pass) { setErr('Informe e-mail e senha.'); return; }
    setLoading(true);
    setTimeout(() => {
      const acc = ACCOUNTS[email.trim().toLowerCase()];
      setLoading(false);
      if (!acc || acc.pass !== pass) { setErr('E-mail ou senha incorretos.'); return; }
      onSuccess(acc.role);
    }, 700);
  };
  const fill = (k) => { setEmail(k); setPass(ACCOUNTS[k].pass); setErr(''); };
  return (
    <div className="grid min-h-screen grid-cols-[minmax(0,1fr)] bg-white lg:grid-cols-2">
      <div className="relative hidden overflow-hidden bg-forest p-12 text-white lg:flex lg:flex-col">
        <div className="absolute -right-24 -top-24 h-96 w-96 rounded-full bg-mint/10" />
        <button onClick={onHome} className="relative self-start"><LogoHorizontal negative size={40} /></button>
        <div className="relative my-auto">
          <Mark size={120} sw={1.8} />
          <h2 className="mt-8 max-w-md font-display text-[34px] font-extrabold leading-tight">Do arquivo da ANS ao painel, <span className="text-mint">sem planilha no meio.</span></h2>
          <p className="mt-4 max-w-md text-white/70">Extração, tratamento e análise de operadoras e despesas assistenciais em um só lugar.</p>
        </div>
        <span className="relative text-xs text-white/50">Intuitive Care · Controle e Tratamento de dados</span>
      </div>
      <div className="flex min-w-0 flex-col px-5 py-6 sm:px-10">
        <div className="flex items-center justify-between">
          <button onClick={onHome} className="flex items-center gap-1.5 text-sm font-medium text-muted hover:text-ink"><Icon name="ArrowLeft" size={15} />Página inicial</button>
          <button onClick={onBack} className="text-sm font-medium text-muted hover:text-ink">Design System</button>
        </div>
        <div className="mx-auto my-auto w-full max-w-[400px] py-10">
          <div className="lg:hidden"><LogoHorizontal size={40} /></div>
          <h1 className="mt-8 font-display text-[28px] font-extrabold tracking-tight lg:mt-0">Entrar</h1>
          <p className="mt-1 text-sm text-muted">Use seu e-mail corporativo e senha.</p>
          <form onSubmit={submit} className="mt-8 space-y-4" noValidate>
            <div>
              <label htmlFor="email" className="mb-1.5 block text-sm font-semibold">E-mail</label>
              <div className="relative">
                <span className="absolute left-4 top-1/2 -translate-y-1/2 text-muted"><Icon name="Mail" size={16} /></span>
                <input id="email" type="email" autoComplete="username" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="nome@intuitivecare.com.br"
                  className={cx('h-12 w-full rounded-full border bg-white pl-11 pr-4 text-sm outline-none transition focus:ring-4', err ? 'border-red-300 focus:border-danger focus:ring-red-100' : 'border-slate-200 focus:border-mint focus:ring-mint/20')} />
              </div>
            </div>
            <div>
              <div className="mb-1.5 flex items-center justify-between">
                <label htmlFor="senha" className="text-sm font-semibold">Senha</label>
                <button type="button" className="text-xs font-semibold text-forest hover:underline">Esqueci a senha</button>
              </div>
              <div className="relative">
                <span className="absolute left-4 top-1/2 -translate-y-1/2 text-muted"><Icon name="Lock" size={16} /></span>
                <input id="senha" type={show ? 'text' : 'password'} autoComplete="current-password" value={pass} onChange={(e) => setPass(e.target.value)} placeholder="Sua senha"
                  className={cx('h-12 w-full rounded-full border bg-white pl-11 pr-12 text-sm outline-none transition focus:ring-4', err ? 'border-red-300 focus:border-danger focus:ring-red-100' : 'border-slate-200 focus:border-mint focus:ring-mint/20')} />
                <button type="button" onClick={() => setShow(!show)} aria-label={show ? 'Ocultar senha' : 'Mostrar senha'} className="absolute right-3 top-1/2 grid h-8 w-8 -translate-y-1/2 place-items-center rounded-full text-muted hover:bg-surface"><Icon name={show ? 'EyeOff' : 'Eye'} size={16} /></button>
              </div>
            </div>
            {err && <div role="alert" className="flex items-center gap-2 rounded-xl bg-red-50 px-4 py-2.5 text-sm text-red-700"><Icon name="CircleAlert" size={15} />{err}</div>}
            <Button type="submit" size="lg" className="w-full" disabled={loading}>
              {loading ? <><span className="inline-flex animate-spin"><Icon name="LoaderCircle" size={16} /></span>Entrando...</> : 'Entrar'}
            </Button>
          </form>
          <div className="mt-8 rounded-2xl bg-[#F6F8F7] p-4">
            <div className="text-xs font-bold uppercase tracking-[.08em] text-muted">Acessos de demonstração</div>
            <div className="mt-3 grid grid-cols-[minmax(0,1fr)] gap-2">
              {[['admin@intuitivecare.com.br', 'Administrador', 'ShieldCheck'], ['consumidor@intuitivecare.com.br', 'Consumidor', 'Eye']].map(([k, l, i]) => (
                <button key={k} onClick={() => fill(k)} className="flex items-center gap-3 rounded-xl bg-white px-3 py-2.5 text-left hover:ring-2 hover:ring-mint/40">
                  <span className="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-forest text-mint"><Icon name={i} size={14} /></span>
                  <span className="min-w-0 flex-1"><span className="block text-sm font-semibold">{l}</span><span className="block truncate font-mono text-[11px] text-muted">{k} · {ACCOUNTS[k].pass}</span></span>
                  <span className="text-xs font-semibold text-forest">Preencher</span>
                </button>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

/* ============ App ============ */
const ROUTES = { home: '#inicio', login: '#login', proto: '#prototipo' };
const App = () => {
  const fromHash = () => (Object.keys(ROUTES).find((k) => ROUTES[k] === location.hash) || 'ds');
  const [mode, setMode] = useState(() => { const m = fromHash(); return m === 'proto' ? 'login' : m; });
  const [role, setRole] = useState('admin');
  const go = (m) => {
    setMode(m);
    try { history.replaceState(null, '', ROUTES[m] || location.pathname + location.search); } catch (e) {}
    window.scrollTo({ top: 0 });
  };
  if (mode === 'home') return <Home onLogin={() => go('login')} onBack={() => go('ds')} />;
  if (mode === 'login') return <Login onSuccess={(r) => { setRole(r); go('proto'); }} onHome={() => go('home')} onBack={() => go('ds')} />;
  if (mode === 'proto') return <Prototype key={role} initialRole={role} onBack={() => go('ds')} onLogout={() => go('login')} />;
  return <DesignSystem onEnter={() => go('home')} />;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
